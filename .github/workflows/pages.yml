# Build the Web version with Pyxel and publish it on GitHub Pages.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pyxel
        run: pip install pyxel==3.0.0
      - name: Package the game as HTML
        run: |
          pyxel package game game/main.py
          mkdir site
          mv game.pyxapp site/
          cd site
          pyxel app2html game.pyxapp
          mv game.html index.html
          rm game.pyxapp
          ls -la
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
